name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    name: Build the zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        run: |
          mkdir -p dist/mpv
          cp -r mpv.conf input.conf script-opts scripts README.md LICENSE dist/mpv/
          cd dist
          zip -r "../boda-${GITHUB_REF_NAME}.zip" mpv

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: boda-*.zip
          body: |
            Unpack into `%APPDATA%\mpv`. Back up your current config first.
            See the [README](https://github.com/skps2000/mpv-boda#readme) for the rest.
