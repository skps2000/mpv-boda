name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    name: Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Check
        run: luacheck scripts tests

  config:
    name: Config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No key bound twice in input.conf
        run: |
          dup=$(awk '/^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
                     { if (seen[$1]) print $1; else seen[$1]=1 }' input.conf)
          if [ -n "$dup" ]; then
            echo "bound twice:"; echo "$dup"; exit 1
          fi

      - name: Values needing quotes in mpv.conf
        run: |
          # a value starting with # or % has to be quoted, or mpv drops the line
          bad=$(grep -nE '^[a-z0-9-]+=[#%]' mpv.conf || true)
          if [ -n "$bad" ]; then
            echo "needs quotes:"; echo "$bad"; exit 1
          fi

      - name: Every action input.conf calls exists
        run: |
          {
            grep -o 'script-binding boda/[a-z0-9-]*' input.conf | sed 's|.*boda/||'
            grep -ohE 'bind\("[a-z0-9-]+"\)' scripts/boda/mod/menu.lua | sed 's/.*"\(.*\)".*/\1/'
          } | sort -u > used.txt
          { grep -ohE 'add_key_binding\(nil, "[a-z0-9-]+"' -r scripts/boda | sed 's/.*"\(.*\)"/\1/'
            grep -ohE '\b(action|vf_action|af_action)\("[a-z0-9-]+"' -r scripts/boda | sed 's/.*"\(.*\)"/\1/'
            grep -ohE '\{ id = "[a-z0-9-]+"' scripts/boda/mod/panel.lua | sed 's/.*"\(.*\)"/panel-\1/'
            for i in $(seq 0 9); do echo "digit-$i"; done
            printf 'mark-intro\nmark-outro\n'
          } | sort -u > registered.txt
          missing=$(comm -23 used.txt registered.txt)
          if [ -n "$missing" ]; then
            echo "called by input.conf but not registered:"; echo "$missing"; exit 1
          fi
