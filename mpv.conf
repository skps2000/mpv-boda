# boda — 팟플레이어 스타일 mpv 설정 (Windows)
#
# 주의: 값 안에 # 나 % 가 들어가면 반드시 따옴표로 감싼다.
#       감싸지 않으면 mpv 가 주석/특수문법으로 읽고 그 줄을 조용히 버린다.

# ── 화질 ─────────────────────────────────────────────────────────────
vo=gpu-next
hwdec=auto-safe
profile=high-quality
scale=ewa_lanczossharp
dscale=mitchell
deband=yes

# ── 창 ───────────────────────────────────────────────────────────────
# 파일이 바뀌어도 창 크기를 유지한다 (예전에는 스크립트가 geometry 로 흉내냈다)
auto-window-resize=no
keep-open=yes
keep-open-pause=yes
keepaspect=yes
keepaspect-window=no
cursor-autohide=1200
title=${media-title} - mpv
# 파일을 다 보거나 정지해도 창을 닫지 않는다 (대기 화면에서 이어보기)
idle=yes
force-window=yes
# 기본 OSC/탐색바는 끄고 boda 의 것을 쓴다
osc=no
osd-bar=no

# ── OSD ──────────────────────────────────────────────────────────────
osd-font=Malgun Gothic
osd-font-size=20
# mpv 의 색은 #AARRGGBB 순서다 (#000000A0 은 알파 00 = 완전 투명)
osd-color="#F2F0EC"
osd-outline-color="#A0000000"
osd-outline-size=1
osd-duration=900
osd-playing-msg=

# ── 재생 ─────────────────────────────────────────────────────────────
save-position-on-quit=yes
resume-playback=yes
watch-later-options=start
# 같은 폴더의 파일을 자동으로 재생목록에 넣는다 (1화, 2화, 10화 순서로 정렬)
autocreate-playlist=filter
volume=70
volume-max=150
af=scaletempo2

# ── 소리 / 자막 ──────────────────────────────────────────────────────
audio-file-auto=fuzzy
sub-auto=fuzzy
secondary-sub-ass-override=yes

# ── 스크린샷 ─────────────────────────────────────────────────────────
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-template="%F-%wH%wM%wS-%wT"
