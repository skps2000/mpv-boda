# boda — PotPlayer-style mpv config (Windows)
#
# Careful: a value containing # or % must be quoted. Without quotes mpv reads it
# as a comment or as special syntax and silently drops the line.

# ── picture ──────────────────────────────────────────────────────────
vo=gpu-next
hwdec=auto-safe
profile=high-quality
scale=ewa_lanczossharp
dscale=mitchell
deband=yes

# ── window ───────────────────────────────────────────────────────────
# keep the window size when the file changes
auto-window-resize=no
keep-open=yes
keep-open-pause=yes
keepaspect=yes
keepaspect-window=no
cursor-autohide=1200
title=${media-title} - mpv
# stay open after the last file or a stop, showing the continue-watching screen
idle=yes
force-window=yes
# turn mpv's own OSC off, boda draws its own
osc=no
osd-bar=no

# ── OSD ──────────────────────────────────────────────────────────────
osd-font=Segoe UI
osd-font-size=20
# mpv colours are #AARRGGBB, so alpha comes first (#000000A0 would be invisible)
osd-color="#F2F0EC"
osd-outline-color="#A0000000"
osd-outline-size=1
osd-duration=900
osd-playing-msg=

# ── playback ─────────────────────────────────────────────────────────
save-position-on-quit=yes
resume-playback=yes
watch-later-options=start
# build a playlist from the folder, in natural order (ep2 before ep10)
autocreate-playlist=filter
# only video files go in: no music, images, playlist files or bare folder rows
directory-filter-types=video
video-exts-add=asf,divx,dat,f4v,m2v,mpe,mts,rm,tp,vob
# walk a folder all the way down, so every video below it is in the list
directory-mode=recursive
volume=70
volume-max=150
af=scaletempo2

# ── audio and subtitles ──────────────────────────────────────────────
audio-file-auto=fuzzy
sub-auto=fuzzy
secondary-sub-ass-override=yes

# ── screenshots ──────────────────────────────────────────────────────
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-template="%F-%wH%wM%wS-%wT"
