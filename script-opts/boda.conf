# boda settings. Restart mpv after changing them.
# For a one-off change: mpv --script-opts=boda-auto_color=yes

# UI language: en or ko
language=en

# ── looks ────────────────────────────────────────────
# UI font
font=Segoe UI
# UI scale (0 = follow the window height)
scale=0
# accent colour (#RRGGBB)
accent=FF0000

# ── behaviour ────────────────────────────────────────
# Nudge brightness/contrast/saturation per file, based on resolution.
# Off by default: you see the original picture. (F7 panel can turn it on too)
auto_color=no
# continue where you left off
resume=yes
# Seek bar previews (needs ffmpeg)
# install: scoop install ffmpeg   or   winget install Gyan.FFmpeg
thumbnails=yes
# Path to ffmpeg. Empty = look in the mpv folder and PATH.
ffmpeg=
# volume change for one wheel notch
wheel_volume=5
# How far the arrow keys seek, in seconds. Menu > Seek changes these too, and
# what you pick there wins from then on.
seek_arrow=8
seek_ctrl=30
seek_shift=100
seek_alt=300
# how many files the continue-watching screen keeps
history_size=60
# default width of the side panel, in px
panel_width=360
# Let uosc draw the menus when it is installed (https://github.com/tomasklaen/uosc).
# no = always use the native window menu and mpv's console for the palette.
uosc=yes
# What goes in the context menu, and in what order. Empty = the default below.
# Use - for a separator. Available names:
#   open resume playlist fav chapter speed seek loop skip video audio sub color
#   window capture copy panel settings
# e.g. menu_sections=open,playlist,fav,-,speed,video,audio,sub,-,settings
menu_sections=

# Where history is kept. Empty = the mpv state dir (%LOCALAPPDATA%\mpv\boda),
# so nothing personal ends up in the config folder.
state_dir=
