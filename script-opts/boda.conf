# boda 설정. 고친 뒤 mpv 를 다시 실행하면 적용된다.
# 임시로만 바꾸려면: mpv --script-opts=boda-auto_color=yes

# ── 모양 ─────────────────────────────────────────────
# UI 글꼴
font=Malgun Gothic
# UI 배율 (0 = 창 높이에 맞춰 자동)
scale=0
# 강조색 (#RRGGBB 순서)
accent=FF0000

# ── 동작 ─────────────────────────────────────────────
# 파일을 열 때마다 해상도에 맞춰 밝기/대비/채도를 자동으로 조정할지.
# 기본은 끔 — 원본 화면을 그대로 보여준다. (F7 패널에서도 켤 수 있다)
auto_color=no
# 마지막으로 본 위치에서 이어보기
resume=yes
# 탐색바에 마우스를 올렸을 때 미리보기 (ffmpeg 이 있어야 동작)
# 설치: scoop install ffmpeg  또는  winget install Gyan.FFmpeg
thumbnails=yes
# ffmpeg 경로. 비우면 mpv 폴더와 PATH 에서 찾는다.
ffmpeg=
# 휠 한 칸에 바뀌는 음량
wheel_volume=5
# 대기 화면에 남기는 기록 개수
history_size=60
# 목록 패널 기본 너비(px)
panel_width=320
# 기록을 저장할 폴더. 비우면 mpv 상태 폴더(%LOCALAPPDATA%\mpv\boda).
# 설정 폴더에는 개인 기록을 남기지 않는다.
state_dir=
