# boda — PotPlayer's keys, mapped onto mpv
#
# What is written here is what actually happens: the script never grabs a key on
# its own, so this file is the only place you need to edit.
#   script-binding boda/<name>   an action from the boda script
#   For a shifted letter write the capital (N, not Shift+n)

# ── general ──────────────────────────────────────────────────────────
F1           script-binding boda/about
F2           script-binding boda/open-folder
F3           script-binding boda/open-file
F4           script-binding boda/menu
Ctrl+F4      script-binding boda/stop
F5           script-binding boda/open-config
F6           script-binding boda/panel-toggle
F7           script-binding boda/panel-color
F8           script-binding boda/dual-sub
F9           script-binding boda/upscale-toggle
F10          script-binding boda/pip
F11          cycle fullscreen
F12          script-binding boda/open-file
Alt+F4       quit
Ctrl+F1      script-binding stats/display-stats-toggle
Ctrl+F12     script-binding console/enable
Ctrl+u       script-binding boda/open-url
Alt+F12      script-binding boda/open-url
Ctrl+v       script-binding boda/open-clipboard
Ctrl+y       script-binding boda/reopen
Alt+o        script-binding boda/open-sub
Alt+e        script-binding boda/open-sub
Ctrl+Alt+y   script-binding boda/reload-sub
Ctrl+f       script-binding boda/open-config
Ctrl+s       screenshot
Ctrl+Shift+m script-binding boda/save-m3u
Ctrl+Shift+o script-binding boda/load-m3u
b            script-binding boda/boss
Ctrl+Shift+r script-binding boda/record
Ctrl+i       script-binding boda/mark-intro
Ctrl+o       script-binding boda/mark-outro
Ctrl+Shift+i script-binding boda/clear-skip

# PotPlayer features mpv does not have: just say so
Ctrl+j       script-message boda-na na_webcam
Ctrl+w       script-message boda-na na_tv_analog
Ctrl+k       script-message boda-na na_tv_digital
Alt+d        script-message boda-na na_device
Ctrl+d       script-message boda-na na_dvd
Ctrl+Alt+d   script-message boda-na na_bluray
Alt+p        script-message boda-na na_sub_edit
Alt+f        script-message boda-na na_sub_font
E            script-message boda-na na_equalizer
R            script-message boda-na "Freeverb"

# ── playback ─────────────────────────────────────────────────────────
SPACE        cycle pause
PGUP         playlist-prev
PGDWN        playlist-next
DEL          script-binding boda/playlist-remove
Shift+DEL    script-binding boda/playlist-remove

d            frame-back-step; show-text "${playback-time} / ${duration}" 800
D            frame-back-step; show-text "${playback-time} / ${duration}" 800
f            frame-step; show-text "${playback-time} / ${duration}" 800
F            frame-step; show-text "${playback-time} / ${duration}" 800

LEFT         seek -5;   show-text "${playback-time} / ${duration}" 800
RIGHT        seek  5;   show-text "${playback-time} / ${duration}" 800
Ctrl+LEFT    seek -30;  show-text "${playback-time} / ${duration}" 800
Ctrl+RIGHT   seek  30;  show-text "${playback-time} / ${duration}" 800
Shift+LEFT   seek -60;  show-text "${playback-time} / ${duration}" 800
Shift+RIGHT  seek  60;  show-text "${playback-time} / ${duration}" 800
Ctrl+Alt+LEFT   seek -300; show-text "${playback-time} / ${duration}" 800
Ctrl+Alt+RIGHT  seek  300; show-text "${playback-time} / ${duration}" 800
Ctrl+Shift+LEFT   seek -1 keyframes
Ctrl+Shift+RIGHT  seek  1 keyframes

BS           script-binding boda/jump-start
Ctrl+BS      script-binding boda/jump-mid
Shift+BS     script-binding boda/jump-end
g            script-binding boda/jump-time
G            script-binding boda/jump-time
HOME         sub-seek -1
END          sub-seek 1

# number keys: seek by percent while playing, open a recent file when idle
0            script-binding boda/digit-0
1            script-binding boda/digit-1
2            script-binding boda/digit-2
3            script-binding boda/digit-3
4            script-binding boda/digit-4
5            script-binding boda/digit-5
6            script-binding boda/digit-6
7            script-binding boda/digit-7
8            script-binding boda/digit-8
9            script-binding boda/digit-9

# speed: Z back to normal / X slower / C faster
z            script-binding boda/speed-toggle
Z            script-binding boda/speed-toggle
x            script-binding boda/speed-down
X            script-binding boda/speed-down
c            script-binding boda/speed-up
C            script-binding boda/speed-up

# bookmarks and chapters
p            script-binding boda/bookmark-add
P            script-binding boda/bookmark-add
Shift+PGUP   script-binding boda/bookmark-prev
Shift+PGDWN  script-binding boda/bookmark-next
h            script-binding boda/panel-chapter
H            script-binding boda/panel-chapter

# Clips: + saves this moment. Set [ and ] first to save a range instead.
+            script-binding boda/favorite-add
KP_ADD       script-binding boda/favorite-add
INS          script-binding boda/favorite-add
Ctrl+INS     script-binding boda/panel-fav

# A-B loop
[            script-binding boda/ab-a
]            script-binding boda/ab-b
{            script-binding boda/ab-clear-a
}            script-binding boda/ab-clear-b
\            script-binding boda/ab-toggle
Ctrl+[       script-message boda-ab-nudge ab-loop-a -0.1
Ctrl+]       script-message boda-ab-nudge ab-loop-b -0.1
Alt+[        script-message boda-ab-nudge ab-loop-a 0.1
Alt+]        script-message boda-ab-nudge ab-loop-b 0.1
Ctrl+Alt+[   script-message boda-ab-nudge-both -0.1
Ctrl+Alt+]   script-message boda-ab-nudge-both 0.1
Ctrl+\       sub-seek 0

# ── subtitles ────────────────────────────────────────────────────────
l            script-binding boda/panel-sub
L            script-binding boda/panel-sub
Alt+l        cycle sub
Alt+Ctrl+l   cycle secondary-sid
Alt+h        cycle sub-visibility
Alt+i        cycle sub-use-margins
Alt+b        cycle sub-bold
Alt+PGUP     add sub-font-size 2
Alt+PGDWN    add sub-font-size -2
Alt+HOME     script-binding boda/sub-pos-reset
Alt+UP       add sub-pos -1
Alt+DOWN     add sub-pos 1
Alt+LEFT     add sub-margin-x -10
Alt+RIGHT    add sub-margin-x 10

,            add sub-delay -0.5
.            add sub-delay  0.5
Ctrl+,       add sub-delay -5
Ctrl+.       add sub-delay  5
Alt+,        add sub-delay -50
Alt+.        add sub-delay  50
/            script-binding boda/sub-delay-reset

# ── video ────────────────────────────────────────────────────────────
v            script-binding boda/panel-video
V            script-binding boda/panel-video
Alt+v        cycle video
Ctrl+Shift+d cycle deinterlace
Ctrl+q       cycle-values video-aspect-override -1 16:9 4:3 2.35:1 1.85:1
Ctrl+F5      cycle-values video-aspect-override -1 16:9 4:3 2.35:1
Ctrl+F6      cycle-values video-aspect-override -1 16:9 4:3
j            cycle-values video-stereo-mode no sbs2l ab2l
J            cycle-values video-stereo-mode no sbs2l ab2l

Ctrl+p       script-binding boda/flip-v
Ctrl+z       script-binding boda/flip-h
Ctrl+b       script-binding boda/blur
Ctrl+r       script-binding boda/sharpen
Ctrl+h       script-binding boda/deblock
Ctrl+n       script-binding boda/denoise
Ctrl+m       script-binding boda/denoise
Ctrl+Alt+f   script-binding boda/filters-clear
Alt+k        script-binding boda/rotate
Ctrl+l       script-message boda-na na_level
Ctrl+x       script-message boda-na na_vf_convert

# colour (F7 opens the panel with sliders)
q            script-binding boda/eq-toggle
Q            script-binding boda/eq-toggle
w            add brightness -1; script-binding boda/eq-show
e            add brightness  1; script-binding boda/eq-show
r            add contrast   -1; script-binding boda/eq-show
t            add contrast    1; script-binding boda/eq-show
y            add saturation -1; script-binding boda/eq-show
u            add saturation  1; script-binding boda/eq-show
i            add hue        -1; script-binding boda/eq-show
o            add hue         1; script-binding boda/eq-show
Ctrl+Shift+w add gamma      -1; script-binding boda/eq-show
Ctrl+Shift+e add gamma       1; script-binding boda/eq-show
Ctrl+Alt+r   script-binding boda/eq-reset
Ctrl+Alt+a   script-binding boda/auto-color-toggle

# capture
k            screenshot video
K            screenshot video
Ctrl+g       screenshot video
Ctrl+e       screenshot video
Alt+n        screenshot window
Ctrl+Alt+c   screenshot window
Ctrl+Alt+e   screenshot window
Ctrl+c       script-binding boda/shot-clipboard

# ── audio ────────────────────────────────────────────────────────────
UP           add volume  5
DOWN         add volume -5
Shift+UP     add volume  10
Shift+DOWN   add volume -10
Ctrl+Alt+UP     add volume  5
Ctrl+Alt+DOWN   add volume -5
m            cycle mute
M            cycle mute
Ctrl+Alt+m   cycle mute
a            script-binding boda/panel-audio
A            script-binding boda/panel-audio
Alt+a        cycle audio

<            add audio-delay -0.05
>            add audio-delay  0.05
|            script-binding boda/audio-delay-reset

N            script-binding boda/audio-norm
T            script-binding boda/stereo-swap
Ctrl+Shift+v script-binding boda/voice-remove
Ctrl+Alt+n   script-binding boda/audio-reset

# ── window and framing ───────────────────────────────────────────────
TAB          script-binding boda/window-cycle
Shift+TAB    script-binding stats/display-stats-toggle
ENTER        cycle fullscreen
Alt+ENTER    cycle fullscreen
Ctrl+Alt+ENTER    cycle fullscreen
Ctrl+Shift+ENTER  cycle fullscreen
Ctrl+ENTER   cycle-values panscan 0 1
Ctrl+t       cycle ontop
Alt+1        script-message boda-window-scale 0.5
Alt+2        script-message boda-window-scale 1
Alt+3        script-message boda-window-scale 1.5
Alt+4        script-message boda-window-scale 2
Alt+5        script-binding boda/window-max
`            script-message boda-window-scale 0.3
Ctrl+Alt+KP_ADD       add window-scale  0.1
Ctrl+Alt+KP_SUBTRACT  add window-scale -0.1

KP0          cycle-values window-scale 0.5 1 1.5 2
KP5          script-binding boda/window-reset
KP9          add video-zoom  0.1
KP1          add video-zoom -0.1
KP8          add video-zoom  0.05
KP2          add video-zoom -0.05
KP6          add video-aspect-override  0.05
KP4          add video-aspect-override -0.05
Ctrl+KP6     add video-pan-x -0.02
Ctrl+KP4     add video-pan-x  0.02
Ctrl+KP8     add video-pan-y  0.02
Ctrl+KP2     add video-pan-y -0.02
Ctrl+KP5     set video-pan-x 0; set video-pan-y 0

# ── mouse ────────────────────────────────────────────────────────────
# boda takes clicks and wheel in one place and decides whether the UI was hit.
# To get mpv's default right click back, make the line below 'MBTN_RIGHT cycle pause'.
MBTN_LEFT      script-binding boda/mouse-left
MBTN_LEFT_DBL  script-binding boda/mouse-left-dbl
WHEEL_UP       script-binding boda/wheel-up
WHEEL_DOWN     script-binding boda/wheel-down
MBTN_RIGHT     script-binding boda/menu
MBTN_MID       cycle pause
WHEEL_LEFT     seek -5 exact
WHEEL_RIGHT    seek  5 exact
