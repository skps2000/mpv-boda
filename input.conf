# PotPlayer default shortcuts mapped onto mpv
# User bindings override mpv defaults for the same key.

# --- General ---
F1          script-message pp-about
F2          script-message pp-open-folder
F3          script-message pp-open-file
F4          script-message pp-stop
F5          script-message pp-open-config
F6          script-message ui-pl-toggle
F7          script-message ui-color-toggle
F8          script-message pp-dual-sub
F9          script-message pp-upscale
F10         script-message pp-pip
Ctrl+i      script-message pp-mark-intro
Ctrl+o      script-message pp-mark-outro
Ctrl+Shift+i script-message pp-clear-skip
Ctrl+Shift+m script-message pp-save-m3u
Ctrl+Shift+o script-message pp-load-m3u
b           script-message pp-boss
Ctrl+Shift+r script-message pp-record
F11         cycle fullscreen
F12         script-message pp-open-file
Ctrl+F1     script-binding stats/display-stats-toggle
Alt+F4      quit
Ctrl+u      script-message pp-open-url
Alt+F12     script-message pp-open-url
Ctrl+v      script-message pp-open-clipboard
Ctrl+F12    script-binding console/enable
Ctrl+s      screenshot
Ctrl+j      script-message pp-na "웹캠/장치"
Ctrl+w      script-message pp-na "아날로그 TV"
Ctrl+k      script-message pp-na "디지털 TV"
Alt+d       script-message pp-na "장치 설정"
Ctrl+d      script-message pp-na "DVD 열기"
Ctrl+Alt+d  script-message pp-na "Blu-ray 열기"
Alt+o       script-message pp-load-sub
Ctrl+Alt+y  script-message pp-reload-sub
Ctrl+y      script-message pp-reopen

# --- Playback ---
SPACE       cycle pause
PGUP        playlist-prev
PGDWN       playlist-next
h           script-message pp-dock-show chapter
H           script-message pp-dock-show chapter
p           script-message pp-bookmark-add
P           script-message pp-bookmark-add
Shift+PGUP  script-message pp-bookmark-prev
Shift+PGDWN script-message pp-bookmark-next

d           frame-back-step; show-text "${playback-time} / ${duration}" 0.8
D           frame-back-step; show-text "${playback-time} / ${duration}" 0.8
f           frame-step; show-text "${playback-time} / ${duration}" 0.8
F           frame-step; show-text "${playback-time} / ${duration}" 0.8
Ctrl+Shift+LEFT   seek -1 keyframes
Ctrl+Shift+RIGHT  seek 1 keyframes

LEFT        seek -5
RIGHT       seek 5
Ctrl+LEFT   seek -30
Ctrl+RIGHT  seek 30
Shift+LEFT  seek -60
Shift+RIGHT seek 60
Ctrl+Alt+LEFT   seek -300
Ctrl+Alt+RIGHT  seek 300

BS          script-message pp-jump-start
Ctrl+BS     script-message pp-jump-mid
Shift+BS    script-message pp-jump-end30
HOME        sub-seek -1
END         sub-seek 1
Ctrl+HOME   script-message pp-na "현재 자막 위치로"
g           script-message pp-jump-time
G           script-message pp-jump-time
Shift+z     script-message pp-na "장면 탐색"
Alt+z       script-message pp-na "마커 장면 탐색"

# Speed: Z normal/last, X slower, C faster
z           script-message pp-speed-toggle
Z           script-message pp-speed-toggle
x           script-message pp-speed-down
X           script-message pp-speed-down
c           script-message pp-speed-up
C           script-message pp-speed-up

Shift+DEL   playlist-remove current
Ctrl+Shift+DEL playlist-remove current

# A-B repeat
[           script-message pp-ab-a
]           script-message pp-ab-b
Shift+[     script-message pp-ab-clear-a
Shift+]     script-message pp-ab-clear-b
Ctrl+[      script-message pp-ab-nudge ab-loop-a -0.1
Ctrl+]      script-message pp-ab-nudge ab-loop-b -0.1
Alt+[       script-message pp-ab-nudge ab-loop-a 0.1
Alt+]       script-message pp-ab-nudge ab-loop-b 0.1
Ctrl+Alt+[  script-message pp-ab-nudge-both -0.1
Ctrl+Alt+]  script-message pp-ab-nudge-both 0.1
\           script-message pp-ab-toggle
Ctrl+\      sub-seek 0
INS         script-message pp-na "현재 자막 구간 반복"
Alt+\       script-message pp-na "마커 구간 반복"
Shift+\     set audio-delay 0; show-text "오디오 싱크 초기화"

# --- Subtitles ---
l           script-message pp-dock-show sub
L           script-message pp-dock-show sub
Alt+l       cycle sub
Alt+Ctrl+l  cycle secondary-sid
Alt+h       cycle sub-visibility
Alt+e       script-message pp-load-sub
Alt+p       script-message pp-na "자막 입력"
Alt+i       cycle sub-use-margins
Alt+b       cycle sub-bold
Alt+PGUP    add sub-font-size 2
Alt+PGDWN   add sub-font-size -2
Alt+f       script-message pp-na "자막 글꼴 설정"
Alt+HOME    set sub-pos 100; set sub-scale 1; show-text "자막 위치 초기화"
Alt+UP      add sub-pos -1
Alt+DOWN    add sub-pos 1
Alt+LEFT    add sub-margin-x -10
Alt+RIGHT   add sub-margin-x 10

,           add sub-delay -0.5
.           add sub-delay 0.5
Ctrl+,      add sub-delay -5
Ctrl+.      add sub-delay 5
Alt+,       add sub-delay -50
Alt+.       add sub-delay 50
/           set sub-delay 0; show-text "자막 싱크 초기화"
<           add sub-delay -0.5
>           add sub-delay 0.5
Ctrl+<      add sub-delay -5
Ctrl+>      add sub-delay 5
Alt+<       add sub-delay -50
Alt+>       add sub-delay 50
Ctrl+Alt+,  set sub-delay 0
Ctrl+Alt+.  set sub-delay 0
Alt+s       script-message pp-na "자막 저장"
Ctrl+Shift+s script-message pp-na "자막 저장"
Ctrl+Alt+s  script-message pp-na "자막 저장"

# --- Video ---
v           script-message pp-dock-show video
V           script-message pp-dock-show video
Alt+v       cycle video
s           cycle-values glsl-shaders "" ; show-text "픽셀 셰이더(기본 없음)"
S           cycle-values glsl-shaders ""
Shift+p     show-text "프리리사이즈 셰이더"
Ctrl+Alt+p  show-text "포스트리사이즈 셰이더"
j           cycle-values video-stereo-mode no sbs2l ab2l
J           cycle-values video-stereo-mode no sbs2l ab2l
Ctrl+x      script-message pp-na "비디오 변환 필터"
Ctrl+Shift+d cycle deinterlace
Ctrl+q      cycle-values video-aspect-override -1 16:9 4:3 2.35:1 1.85:1

Ctrl+p      script-message pp-vflip
Ctrl+z      script-message pp-hflip
Ctrl+b      script-message pp-blur
Ctrl+r      script-message pp-sharp
Ctrl+l      script-message pp-na "레벨 컨트롤"
Ctrl+h      script-message pp-deblock
Ctrl+n      script-message pp-denoise
Ctrl+m      script-message pp-denoise

q           script-message pp-eq-toggle
w           add brightness -1; script-message pp-eq-show
e           add brightness 1; script-message pp-eq-show
r           add contrast -1; script-message pp-eq-show
t           add contrast 1; script-message pp-eq-show
y           add saturation -1; script-message pp-eq-show
u           add saturation 1; script-message pp-eq-show
i           add hue -1; script-message pp-eq-show
o           add hue 1; script-message pp-eq-show
Ctrl+Shift+w add gamma -1; script-message pp-eq-show
Ctrl+Shift+e add gamma 1; script-message pp-eq-show

Alt+k       script-message pp-rotate
k           screenshot video
K           screenshot video
Alt+n       screenshot window
Ctrl+g      screenshot video
Ctrl+c      script-message pp-shot-clipboard
Ctrl+e      screenshot video
Ctrl+Alt+c  screenshot window
Ctrl+Alt+e  screenshot window
Ctrl+a      script-message pp-na "스트림 녹화"
Ctrl+Shift+a script-message pp-na "스트림 녹화"
Alt+c       script-message pp-na "영상 녹화"

# --- Audio ---
UP          add volume 5
DOWN        add volume -5
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
m           cycle mute
M           cycle mute
Shift+UP    add volume 10
Shift+DOWN  add volume -10
a           script-message pp-dock-show audio
A           script-message pp-dock-show audio
Alt+a       cycle audio
Shift+e     script-message pp-na "이퀄라이저"
Shift+x     script-message pp-na "오디오 변환 필터"
Ctrl+Alt+Shift+UP   add volume 10
Ctrl+Alt+Shift+DOWN add volume -10
Ctrl+Alt+m  cycle mute
Ctrl+Alt+UP add volume 5
Ctrl+Alt+DOWN add volume -5

Shift+,     add audio-delay -0.05
Shift+.     add audio-delay 0.05
Shift+<     add audio-delay -0.05
Shift+>     add audio-delay 0.05

Shift+n     script-message pp-norm
Shift+c     script-message pp-na "Crystality"
Shift+d     script-message pp-denoise
Shift+r     script-message pp-na "Freeverb"
Shift+v     script-message pp-voice-rm
Shift+a     script-message pp-na "보이스 강조"
Shift+t     script-message pp-stereo-swap
Shift+g     script-message pp-na "오디오 녹음"
Shift+h     add speed -0.1
Shift+j     add speed 0.1
Shift+k     set speed 1

# --- Misc ---
TAB         script-message pp-window-cycle
Shift+TAB   script-binding stats/display-stats-toggle
Shift+l     show-text "언어 설정은 mpv.conf"
Ctrl+t      cycle ontop
Ctrl+Alt+a  cycle-values keep-open yes no
Ctrl+f      script-message pp-open-config
DEL         playlist-remove current
Alt+INS     show-text "즐겨찾기 없음 — 플레이리스트에 유지됨"
Ctrl+INS    show-text "폴더 즐겨찾기 없음"

# --- Frame / pan / zoom (numpad) ---
KP0         cycle-values window-scale 0.5 1 1.5 2
KP5         set window-scale 1; set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "원래 크기"
KP9         add video-zoom 0.1
KP1         add video-zoom -0.1
KP6         add video-aspect-override 0.05
KP4         add video-aspect-override -0.05
KP8         add video-zoom 0.05
KP2         add video-zoom -0.05
Ctrl+KP6    add video-pan-x -0.02
Ctrl+KP4    add video-pan-x 0.02
Ctrl+KP8    add video-pan-y 0.02
Ctrl+KP2    add video-pan-y -0.02
Ctrl+KP5    set video-pan-x 0; set video-pan-y 0

Ctrl+F5     cycle-values video-aspect-override -1 16:9 4:3 2.35:1
Ctrl+F6     cycle-values video-aspect-override -1 16:9 4:3

# --- Window size: Tab cycles 0.5 / 1 / 1.5 / 2 ---
`           set window-scale 0.3
# 0-9: YouTube-style percent seek (also forced in potplayer.lua)
0           seek 0 absolute-percent
1           seek 10 absolute-percent
2           seek 20 absolute-percent
3           seek 30 absolute-percent
4           seek 40 absolute-percent
5           seek 50 absolute-percent
6           seek 60 absolute-percent
7           seek 70 absolute-percent
8           seek 80 absolute-percent
9           seek 90 absolute-percent
Alt+1       script-message pp-window-scale 0.5
Alt+2       script-message pp-window-scale 1
Alt+3       script-message pp-window-scale 1.5
Alt+4       script-message pp-window-scale 2
Alt+5       script-message pp-window-max

ENTER       cycle fullscreen
Alt+ENTER   cycle fullscreen
Ctrl+ENTER  cycle-values panscan 0 1
Ctrl+Alt+ENTER cycle fullscreen
Ctrl+Shift+ENTER cycle fullscreen
Ctrl+Alt+KP_ADD   add window-scale 0.1
Ctrl+Alt+KP_SUBTRACT add window-scale -0.1

# Mouse: volume like PotPlayer (not seek)
MBTN_LEFT_DBL cycle pause
# right-click no longer toggles playlist (was easy to hit by mistake)
MBTN_MID    cycle pause
WHEEL_LEFT  seek -5 exact
WHEEL_RIGHT seek 5 exact
